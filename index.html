<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virendra Phirke – Resume</title>

  <!-- Carlito = metric-compatible Calibri. Used only if Calibri isn't installed, so the layout stays identical everywhere. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" media="print"
    onload="this.media='all'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  </noscript>

  <style>
    /* ============================================================
     APP CHROME (toolbar + JSON editor + preview) – never printed / exported
     ============================================================ */
    :root {
      color-scheme: light;
      --bg: #e9ecf2;
      --desk: #dfe3eb;
      --panel: #ffffff;
      --panel-2: #f6f7fa;
      --text: #1b2030;
      --muted: #667085;
      --border: #d8dce5;
      --accent: #1F3864;
      --accent-2: #2c4f8f;
      --accent-soft: rgba(31, 56, 100, .10);
      --danger: #b42318;
      --danger-soft: #fdecea;
      --ok: #067647;
      --ok-soft: #e7f6ee;
      --warn: #b54708;
      --warn-soft: #fff4e5;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 14px rgba(16, 24, 40, .06);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #10131a;
      --desk: #0b0d12;
      --panel: #1a1e29;
      --panel-2: #151923;
      --text: #e8eaf0;
      --muted: #9aa3b5;
      --border: #2c3342;
      --accent: #6b93e0;
      --accent-2: #8aaaec;
      --accent-soft: rgba(107, 147, 224, .16);
      --danger: #ff8a80;
      --danger-soft: rgba(255, 138, 128, .12);
      --ok: #4cd39b;
      --ok-soft: rgba(76, 211, 155, .12);
      --warn: #ffb86b;
      --warn-soft: rgba(255, 184, 107, .12);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    svg.i {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- toolbar ---------- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      backdrop-filter: saturate(1.4) blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
      min-width: 0;
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      font-size: 15px;
      line-height: 1.15;
      margin: 0;
      font-weight: 650;
      letter-spacing: -.01em;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .format-picker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .format-picker select {
      max-width: 190px;
      min-width: 145px;
      padding: 8px 28px 8px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 13px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 550;
      background: var(--panel-2);
      color: var(--muted);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .pill.ok {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: transparent;
    }

    .pill.warn {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: transparent;
    }

    .pill.error {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: transparent;
    }

    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 9px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      line-height: 1.2;
      white-space: nowrap;
      transition: background .15s, border-color .15s, transform .05s, box-shadow .15s;
    }

    .btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: var(--shadow);
    }

    :root[data-theme="dark"] .btn.primary {
      color: #0b1220;
    }

    .btn.primary:hover {
      background: var(--accent-2);
      border-color: var(--accent-2);
    }

    .btn.icon {
      padding: 8px;
    }

    .btn[disabled] {
      opacity: .65;
      cursor: progress;
    }

    .btn.sm {
      padding: 5px 9px;
      font-size: 12.5px;
      border-radius: 8px;
      gap: 6px;
    }

    kbd {
      font: 11px ui-monospace, Menlo, Consolas, monospace;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
    }

    /* ---------- layout ---------- */
    .tabs {
      display: none;
    }

    .workspace {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 18px 80px;
    }

    /* ---------- editor ---------- */
    .editor {
      flex: 0 1 540px;
      min-width: 340px;
      position: sticky;
      top: 72px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor.hidden {
      display: none;
    }

    .editor-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      flex-wrap: wrap;
    }

    .editor-head strong {
      font-size: 13.5px;
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .editor-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .menu {
      position: relative;
    }

    .menu>summary {
      list-style: none;
    }

    .menu>summary::-webkit-details-marker {
      display: none;
    }

    .menu-list {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 40;
      min-width: 200px;
      padding: 5px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 11px;
      box-shadow: 0 12px 32px rgba(16, 24, 40, .22);
    }

    .menu-list button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 9px;
      text-align: left;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: none;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .menu-list button:hover {
      background: var(--accent-soft);
    }

    .menu-list hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 5px 2px;
    }

    .menu-list .hint {
      margin-left: auto;
      color: var(--muted);
      font-size: 11.5px;
    }

    .editor-body {
      position: relative;
    }

    #json-input {
      display: block;
      width: 100%;
      height: min(68vh, 660px);
      min-height: 240px;
      resize: vertical;
      border: 0;
      border-radius: 0;
      font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--text);
      background: var(--panel);
      padding: 12px 14px;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }

    #json-input:focus {
      outline: none;
      box-shadow: inset 0 0 0 2px var(--accent-soft);
    }

    .drop {
      position: absolute;
      inset: 8px;
      display: none;
      place-items: center;
      text-align: center;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      background: color-mix(in srgb, var(--panel) 90%, transparent);
      color: var(--accent);
      font-weight: 600;
      pointer-events: none;
    }

    .editor.dragging .drop {
      display: grid;
    }

    .editor-foot {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
      font-size: 12.5px;
    }

    #status {
      flex: 1;
      min-height: 1.4em;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    #status.error {
      color: var(--danger);
      cursor: pointer;
      text-decoration: underline dotted;
    }

    #status.ok {
      color: var(--ok);
    }

    #status.warn {
      color: var(--warn);
    }

    #counter {
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- preview ---------- */
    .preview {
      flex: 0 1 auto;
      min-width: 0;
    }

    .preview-fit {
      transform-origin: top left;
      position: relative;
    }

    #guides {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      pointer-events: none;
    }

    .guide {
      position: absolute;
      left: -8px;
      right: -8px;
      border-top: 1.5px dashed var(--accent);
      opacity: .75;
    }

    .guide span {
      position: absolute;
      right: 0;
      top: -1px;
      transform: translateY(-100%);
      background: var(--accent);
      color: #fff;
      font: 600 10.5px system-ui, sans-serif;
      padding: 2px 7px;
      border-radius: 6px 6px 0 0;
    }

    :root[data-theme="dark"] .guide span {
      color: #0b1220;
    }

    .zoombar {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(16, 24, 40, .22);
    }

    .zoombar .btn {
      border: 0;
      background: none;
      padding: 7px 9px;
    }

    .zoombar .btn:hover {
      background: var(--accent-soft);
    }

    #zoom-label {
      min-width: 48px;
      text-align: center;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    /* ---------- toast ---------- */
    #toasts {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      max-width: min(420px, calc(100vw - 36px));
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      font-size: 13px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
      animation: tin .18s ease-out;
    }

    .toast.error {
      background: var(--danger);
      color: #fff;
    }

    @keyframes tin {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    /* ---------- responsive ---------- */
    @media (max-width:960px) {
      .tabs {
        display: flex;
        gap: 4px;
        padding: 4px;
        margin: 12px 16px 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 11px;
      }

      .tabs button {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        padding: 8px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--muted);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .tabs button[aria-selected="true"] {
        background: var(--accent);
        color: #fff;
      }

      :root[data-theme="dark"] .tabs button[aria-selected="true"] {
        color: #0b1220;
      }

      .workspace {
        display: block;
        padding: 14px 12px 90px;
      }

      .workspace[data-view="edit"] .preview {
        display: none;
      }

      .workspace[data-view="preview"] .editor {
        display: none;
      }

      .editor {
        position: static;
        min-width: 0;
      }

      #toggle-editor,
      #print-btn,
      #pill-wrap .pill span.txt,
      .brand small {
        display: none !important;
      }

      .toolbar {
        padding: 9px 12px;
      }

      .zoombar {
        bottom: 12px;
      }
    }

    @media (max-width:520px) {
      .format-picker > span {
        display: none;
      }

      .format-picker select {
        min-width: 112px;
        max-width: 135px;
        padding: 8px 5px;
      }

      #download-label {
        display: none;
      }

      .btn.primary {
        padding: 8px 10px;
      }
    }

    /* ============================================================
     RESUME – replicates the original .docx exactly
     A4 · margins T43.15pt R57.6pt B39.6pt L57.6pt · Calibri 10pt #333
     ============================================================ */
    .page {
      width: var(--resume-page-width, 210mm);
      min-height: var(--resume-page-height, 297mm);
      background: #fff;
      color: #333;
      padding: var(--resume-page-padding, 43.15pt 57.6pt 39.6pt 57.6pt);
      font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
      font-size: 10pt;
      line-height: 1.2207;
      /* Calibri ascent+descent, as Word */
      box-shadow: 0 2px 16px rgba(0, 0, 0, .18);
    }

    /* Word spacing rule: gap between paragraphs = larger of (space-after, space-before) -> same as CSS margin collapsing */
    .page .content {
      display: flow-root;
    }

    .page .content>* {
      margin: 0;
    }

    .page a {
      color: inherit;
      text-decoration: none;
    }

    .r-name {
      text-align: center;
      font-weight: 700;
      font-size: 18pt;
      color: #1F3864;
      margin-bottom: 1.25pt !important;
    }

    .r-contact {
      text-align: center;
      font-size: 9pt;
      margin-bottom: 4.5pt !important;
      white-space: pre-wrap;
    }

    .r-contact .blue {
      color: #1F3864;
    }

    .r-h {
      font-weight: 700;
      font-size: 11pt;
      color: #1F3864;
      border-bottom: .75pt solid #1F3864;
      padding-bottom: 2pt;
      margin-top: 9.5pt !important;
      margin-bottom: 4.5pt !important;
      break-after: avoid;
    }

    .r-summary {
      text-align: justify;
      margin-bottom: 2.5pt !important;
    }

    .r-skill {
      text-align: justify;
      margin-bottom: .8pt !important;
    }

    .r-skill:last-of-type {
      margin-bottom: 2pt !important;
    }

    .r-skill b {
      color: #000;
    }

    .r-proj-title {
      font-weight: 700;
      font-size: 10.5pt;
      color: #000;
      margin-top: 8pt !important;
      margin-bottom: 1pt !important;
      break-after: avoid;
      white-space: pre-wrap;
    }

    .r-proj-title .link {
      font-weight: 400;
      font-size: 9.5pt;
      color: #1F3864;
    }

    .r-tech {
      font-style: italic;
      font-size: 9.5pt;
      color: #1F3864;
      margin-bottom: 3pt !important;
      break-after: avoid;
    }

    .r-edu-top.exp {
      margin-top: 8pt !important;
      break-after: avoid;
    }

    .r-edu-sub.exp {
      margin-bottom: 3pt !important;
      break-after: avoid;
    }

    .r-skill,
    .r-summary,
    .r-github,
    .page a {
      overflow-wrap: anywhere;
    }

    .r-ul {
      list-style: none;
      padding: 0;
    }

    .r-ul li {
      position: relative;
      padding-left: 15.8pt;
      margin-bottom: 1.5pt;
      break-inside: avoid;
    }

    .r-ul li::before {
      content: "\2022";
      position: absolute;
      left: 4.3pt;
      top: 0;
    }

    /* 316tw indent, 230tw hanging */
    .r-ul.bold li {
      font-weight: 700;
      color: #000;
    }

    .r-edu-top {
      width: 451.3pt;
      display: flex;
      justify-content: space-between;
      margin-bottom: .5pt !important;
      break-inside: avoid;
    }

    /* right tab @ 9026tw */
    .r-edu-top .deg {
      font-weight: 700;
      color: #000;
    }

    .r-edu-sub {
      width: 451.3pt;
      display: flex;
      justify-content: space-between;
      font-style: italic;
      margin-bottom: 2pt !important;
      break-inside: avoid;
    }

    .r-edu-sub b {
      font-weight: 700;
      color: #000;
    }

    .r-github {
      text-align: justify;
      margin-bottom: 2pt !important;
      white-space: pre-wrap;
    }

    .r-github .gh {
      font-weight: 700;
      color: #1F3864;
    }

    .r-lang {
      margin-bottom: .5pt !important;
      white-space: pre-wrap;
    }

    .r-lang b {
      color: #000;
    }

    /* ---------- Print / "Save as PDF" : real vector text, links stay clickable ---------- */
    @page {
      size: A4 portrait;
      margin: 0;
      /* Suppresses browser header (date/timestamp/title) and footer (URL/pages). */
    }

    @media print {

      :root,
      :root[data-theme="dark"],
      html,
      body {
        color-scheme: light !important;
        background: #ffffff !important;
        color: #333333 !important;
        margin: 0 !important;
        padding: 0 !important;
        --bg: #ffffff !important;
        --desk: #ffffff !important;
        --panel: #ffffff !important;
        --text: #1b2030 !important;
        --muted: #667085 !important;
        --border: #d8dce5 !important;
        --accent: #1F3864 !important;
        --accent-2: #2c4f8f !important;
      }

      .toolbar,
      .tabs,
      .editor,
      .zoombar,
      #toasts,
      #guides,
      #export-stage,
      svg.sprite {
        display: none !important;
      }

      .workspace {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
      }

      .workspace .preview {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
      }

      .preview-fit {
        transform: none !important;
        zoom: 1 !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
      }

      .page {
        width: var(--resume-page-width, 210mm) !important;
        min-height: var(--resume-page-height, 297mm) !important;
        padding: var(--resume-page-padding, 43.15pt 57.6pt 39.6pt 57.6pt) !important;
        margin: 0 auto !important;
        box-shadow: none !important;
        background: #ffffff !important;
        color: #333333 !important;
        box-sizing: border-box !important;
      }

      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    /* Off-screen copy used for the direct PDF download (content width = 210mm − 2×57.6pt) */
    #export-stage {
      position: fixed;
      left: -10000px;
      top: 0;
      background: #ffffff !important;
      color-scheme: light !important;
    }

    .page.export {
      width: 480.1pt;
      min-height: 0;
      padding: 0;
      box-shadow: none;
      background: #ffffff !important;
      color: #333333 !important;
    }
  </style>
</head>

<body>

  <svg class="sprite" width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>

  <script type="module">
    import { RESUME_FORMATS } from './resume-formats/registry.js';
    import { resolveResumePresentation } from './resume-formats/shared/normalize-profile.js';

    (function () {
      'use strict';

      const DEFAULT_JSON = document.getElementById('default-data').textContent.trim();
      const DEFAULT_HEADINGS = {
        summary: 'PROFESSIONAL SUMMARY', skills: 'TECHNICAL SKILLS', experience: 'WORK EXPERIENCE', projects: 'PROJECTS', education: 'EDUCATION',
        certifications: 'CERTIFICATIONS', github: 'GITHUB PROFILE', languages: 'LANGUAGES'
      };
      const STORE_KEY = 'resume-json-v2';
      const FORMAT_STORE_KEY = 'resume-format-v1';
      const ORIGINAL_PAGE = { size: 'A4', width: '210mm', height: '297mm', margins: '43.15pt 57.6pt 39.6pt 57.6pt' };

      const $ = (id) => document.getElementById(id);
      const input = $('json-input'), statusEl = $('status'), resumeEl = $('resume');
      const formatSelect = $('resume-format');
      let activeFormatId = 'original';
      let activePage = { size: 'A4', widthPt: 595.28, heightPt: 841.89, marginsPt: [43.15, 57.6, 39.6, 57.6] };
      const PAGE_PT = () => Math.max(1, activePage.heightPt - activePage.marginsPt[0] - activePage.marginsPt[2]);

      /* ---------------- country format and page metrics ---------------- */
      function lengthToPt(value) {
        const match = String(value).trim().match(/^([0-9.]+)(pt|mm|cm|in|px)$/i);
        if (!match) throw new Error('Unsupported page measurement: ' + value);
        const n = Number(match[1]), unit = match[2].toLowerCase();
        return unit === 'pt' ? n : unit === 'in' ? n * 72 : unit === 'cm' ? n * 72 / 2.54 : unit === 'mm' ? n * 72 / 25.4 : n * 0.75;
      }
      function parseMargins(value) {
        const parts = String(value).trim().split(/\s+/).map(lengthToPt);
        if (parts.length === 1) return [parts[0], parts[0], parts[0], parts[0]];
        if (parts.length === 2) return [parts[0], parts[1], parts[0], parts[1]];
        if (parts.length === 3) return [parts[0], parts[1], parts[2], parts[1]];
        if (parts.length === 4) return parts;
        throw new Error('Page margins must use one to four CSS lengths.');
      }
      function setActiveFormat(id, { persist = true, rerender = true } = {}) {
        const validId = id === 'original' || Object.prototype.hasOwnProperty.call(RESUME_FORMATS, id) ? id : 'original';
        activeFormatId = validId;
        const profile = validId === 'original' ? null : RESUME_FORMATS[validId];
        const page = profile ? profile.page : ORIGINAL_PAGE;
        const margins = parseMargins(page.margins);
        activePage = { size: page.size, widthPt: lengthToPt(page.width), heightPt: lengthToPt(page.height), marginsPt: margins };
        document.documentElement.style.setProperty('--resume-page-width', page.width);
        document.documentElement.style.setProperty('--resume-page-height', page.height);
        document.documentElement.style.setProperty('--resume-page-padding', page.margins);
        resumeEl.dataset.resumeFormat = validId;
        let pageRule = $('dynamic-page-rule');
        if (!pageRule) { pageRule = document.createElement('style'); pageRule.id = 'dynamic-page-rule'; document.head.appendChild(pageRule); }
        pageRule.textContent = '@page { size: ' + page.size + ' portrait; margin: 0; }';
        formatSelect.value = validId;
        if (persist) { try { localStorage.setItem(FORMAT_STORE_KEY, validId); } catch (_) { } }
        if (rerender && current) { render(current); fit(); }
      }
      Object.values(RESUME_FORMATS).forEach(profile => {
        const option = document.createElement('option');
        option.value = profile.id;
        option.textContent = profile.label + ' — ' + profile.documentName;
        formatSelect.appendChild(option);
      });
      formatSelect.addEventListener('change', () => {
        try { setActiveFormat(formatSelect.value); toast('Applied ' + (RESUME_FORMATS[activeFormatId]?.label || 'original') + ' resume format.'); }
        catch (err) { toast('Could not apply format: ' + err.message, 'error'); setActiveFormat('original'); }
      });

      /* ---------------- tiny DOM helpers (textContent only => no HTML injection) ---------------- */
      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null && text !== '') n.textContent = String(text);
        return n;
      }
      function add(parent, ...kids) { kids.forEach(k => k != null && parent.appendChild(typeof k === 'string' ? document.createTextNode(k) : k)); return parent; }
      const str = (v) => (v == null ? '' : String(v));
      const arr = (v) => (Array.isArray(v) ? v : []);
      function linkNode(text, url, cls) {
        const safeUrl = url && /^(https?:\/\/|mailto:)/i.test(url) ? url : null;
        const useA = !!safeUrl;
        const n = document.createElement(useA ? 'a' : 'span');
        if (useA) {
          n.href = safeUrl;
          n.target = '_blank';
          n.rel = 'noopener noreferrer';
        }
        if (cls) n.className = cls;
        n.textContent = text;
        return n;
      }

      /* ---------------- render ---------------- */
      const SECTION_ORDER = ['summary', 'skills', 'experience', 'projects', 'education', 'certifications', 'github', 'languages', 'custom'];
      const KNOWN_KEYS = new Set(['name', 'contact', 'headings', 'order', 'summary', 'skills', 'experience', 'projects', 'education', 'certifications', 'github', 'languages', 'custom']);
      const asList = (v) => Array.isArray(v) ? v.filter(x => x != null && x !== '') : (v == null || v === '' ? [] : [v]);
      const asText = (v, sep) => Array.isArray(v) ? v.join(sep == null ? ', ' : sep) : str(v);
      const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);

      function render(sourceData) {
        const presentation = activeFormatId === 'original' ? { data: sourceData } : resolveResumePresentation(sourceData, activeFormatId);
        const d = presentation.data;
        const H = Object.assign({}, DEFAULT_HEADINGS, isObj(d.headings) ? d.headings : {});
        const root = el('div', 'content');
        const heading = (title) => add(root, el('div', 'r-h', title));
        const bullets = (items, cls) => {
          const list = asList(items); if (!list.length) return;
          const ul = el('ul', 'r-ul' + (cls ? ' ' + cls : ''));
          list.forEach(b => add(ul, el('li', '', str(b)))); add(root, ul);
        };
        const rows = (items) => asList(items).forEach(s => {          // "Label: value" rows (skills style)
          const row = el('div', 'r-skill');
          if (isObj(s) && s.label) add(row, el('b', '', str(s.label).replace(/:\s*$/, '') + ':'), ' ' + asText(s.value));
          else add(row, isObj(s) ? asText(s.value) : str(s));
          add(root, row);
        });
        const titleLine = (left, right, cls) => {                      // bold left + right-aligned date (Word right tab @ 9026tw)
          const top = el('div', 'r-edu-top' + (cls ? ' ' + cls : ''));
          add(top, el('span', 'deg', left), el('span', '', right)); add(root, top);
        };

        /* ----- header ----- */
        if (viewData.name) add(root, el('div', 'r-name', viewData.name));
        const c = isObj(viewData.contact) ? viewData.contact : {};
        const parts = [];
        ['location', 'email', 'phone'].forEach(k => c[k] && parts.push(document.createTextNode(str(c[k]))));
        [['website', 'websiteUrl'], ['linkedin', 'linkedinUrl'], ['github', 'githubUrl'], ['portfolio', 'portfolioUrl']]
          .forEach(([k, u]) => c[k] && parts.push(linkNode(str(c[k]), c[u], 'blue')));
        asList(c.extra).forEach(x => parts.push(document.createTextNode(str(x))));
        if (parts.length) {
          const line = el('div', 'r-contact');
          parts.forEach((pt, i) => { if (i) line.appendChild(document.createTextNode('   |   ')); line.appendChild(pt); });
          add(root, line);
        }

        /* ----- sections ----- */
        const S = {
          summary() {
            if (!d.summary) return;
            heading(H.summary); add(root, el('div', 'r-summary', asText(d.summary, ' ')));
          },
          skills() {
            if (!asList(d.skills).length) return;
            heading(H.skills); rows(d.skills);
          },
          experience() {
            const items = asList(d.experience).filter(isObj); if (!items.length) return;
            heading(H.experience);
            items.forEach(x => {
              if (!isObj(x)) return;
              titleLine(str(x.role || x.title), str(x.dates || x.period), 'exp');
              const sub = [x.company, x.location].filter(Boolean).join(', ');
              if (sub) add(root, el('div', 'r-edu-sub exp', sub));
              bullets(x.bullets);
            });
          },
          projects() {
            const items = asList(d.projects).filter(isObj); if (!items.length) return;
            heading(H.projects);
            items.forEach(p => {
              if (!isObj(p)) return;
              const t = el('div', 'r-proj-title');
              add(t, str(p.title));
              if (p.link) add(t, '   ', linkNode(str(p.link), p.url, 'link'));
              add(root, t);
              if (p.tech) add(root, el('div', 'r-tech', asText(p.tech, ' · ')));
              bullets(p.bullets);
            });
          },
          education() {
            const items = asList(d.education).filter(isObj); if (!items.length) return;
            heading(H.education);
            items.forEach(e => {
              if (!isObj(e)) return;
              titleLine(str(e.degree), str(e.year));
              if (e.institution || e.grade) {
                const sub = el('div', 'r-edu-sub');
                add(sub, el('span', '', str(e.institution)));
                if (e.grade) {
                  const g = el('span', '');
                  add(g, el('b', '', str(e.gradeLabel == null ? 'CGPA: ' : e.gradeLabel + ' ')), str(e.grade));
                  add(sub, g);
                }
                add(root, sub);
              }
            });
          },
          certifications() {
            if (!asList(d.certifications).length) return;
            heading(H.certifications); bullets(d.certifications, 'bold');
          },
          github() {
            const g = d.github;
            if (!isObj(g) || !(g.link || g.text)) return;
            heading(H.github);
            const row = el('div', 'r-github');
            if (g.link) add(row, linkNode(str(g.link), g.url, 'gh'));
            if (g.text) add(row, (g.link ? '  —  ' : '') + str(g.text));
            add(root, row);
          },
          languages() {
            if (!asList(d.languages).length) return;
            heading(H.languages);
            const row = el('div', 'r-lang');
            asList(d.languages).forEach((l, i) => {
              if (i) add(row, '   |   ');
              if (isObj(l)) add(row, el('b', '', l.name), l.level ? ' (' + l.level + ')' : '');
              else add(row, el('b', '', str(l)));
            });
            add(root, row);
          },
          custom() {                                                  // any extra sections: Achievements, Awards, Volunteering, …
            asList(d.custom).forEach(sec => {
              if (!isObj(sec)) return;
              heading(str(sec.heading || sec.title || ''));
              if (sec.text) add(root, el('div', 'r-summary', asText(sec.text, ' ')));
              if (sec.rows) rows(sec.rows);
              bullets(sec.bullets);
            });
          }
        };

        let order = asList(d.order).filter(k => S[k]);
        if (!order.length) order = SECTION_ORDER;
        else SECTION_ORDER.forEach(k => { if (!order.includes(k) && k === 'custom') order.push(k); });
        order.forEach(k => S[k]());

        resumeEl.replaceChildren(root);
      }

      /* warnings for typos like "skils" so nothing silently disappears */
      function lint(d) {
        const w = [];
        Object.keys(d).forEach(k => { if (!KNOWN_KEYS.has(k)) w.push('unknown key “' + k + '” (ignored)'); });
        ['skills', 'experience', 'projects', 'education', 'certifications', 'languages', 'custom'].forEach(k => {
          if (d[k] != null && !Array.isArray(d[k])) w.push('“' + k + '” should be a list [ … ]');
        });
        return w;
      }

      /* ---------------- JSON input handling ---------------- */
      function setStatus(msg, kind) { statusEl.textContent = msg || ''; statusEl.className = kind || ''; }
      function setPill(kind, text) { $('pill').className = 'pill ' + (kind || ''); $('pill-text').textContent = text; }
      function toast(msg, kind) {
        const n = el('div', 'toast' + (kind ? ' ' + kind : ''), msg); $('toasts').appendChild(n);
        setTimeout(() => { n.style.transition = 'opacity .25s'; n.style.opacity = '0'; setTimeout(() => n.remove(), 260); }, kind === 'error' ? 4500 : 2600);
      }
      let errPos = null;
      function updateCounter() {
        const v = input.value; const lines = v ? v.split('\n').length : 0;
        $('counter').textContent = lines + ' lines · ' + v.length.toLocaleString() + ' chars';
      }

      let current = null, lastPages = 1;
      function apply(text, { save = true } = {}) {
        let data;
        try {
          data = JSON.parse(text);
          if (data === null || typeof data !== 'object' || Array.isArray(data)) throw new Error('Top level must be a JSON object { … }');
        } catch (err) {
          const m = /position (\d+)/.exec(err.message); errPos = m ? +m[1] : null;
          setStatus('Invalid JSON: ' + err.message + ' — showing last valid version.' + (errPos != null ? ' (click to jump to the error)' : ''), 'error');
          setPill('error', 'Invalid JSON');
          return false;
        }
        errPos = null;
        try {
          render(data);
        } catch (err) {
          setStatus('Could not render: ' + err.message, 'error'); setPill('error', 'Render error');
          return false;
        }
        current = data;
        const warns = lint(data);
        const pages = Math.max(1, Math.ceil(resumeEl.querySelector('.content').offsetHeight * 0.75 / PAGE_PT()));
        setStatus(warns.length ? '⚠ ' + warns.join('; ') : '✓ Valid JSON — resume updated', warns.length ? 'warn' : 'ok');
        setPill(warns.length ? 'warn' : 'ok', pages + ' page' + (pages > 1 ? 's' : '') + (warns.length ? ' · ' + warns.length + ' warning' + (warns.length > 1 ? 's' : '') : ''));
        lastPages = pages;
        if (save) { try { localStorage.setItem(STORE_KEY, text); } catch (_) { } }
        fit(); updateCounter();
        return true;
      }

      let t;
      input.addEventListener('input', () => { updateCounter(); clearTimeout(t); t = setTimeout(() => apply(input.value), 300); });

      $('format-btn').onclick = () => {
        try { input.value = JSON.stringify(JSON.parse(input.value), null, 2); apply(input.value); }
        catch (e) { toast('Invalid JSON: ' + e.message, 'error'); }
      };
      async function copyText(text) {
        try { await navigator.clipboard.writeText(text); return true; } catch (_) { }
        const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select(); let ok = false;
        try { ok = document.execCommand('copy'); } catch (_) { }
        ta.remove(); return ok;
      }
      $('copy-btn').onclick = async () => {
        closeMenus(); const ok = await copyText(input.value); toast(ok ? 'JSON copied to clipboard' : 'Copy failed — select the text and press Ctrl/Cmd+C.', ok ? '' : 'error');
      };
      $('prompt-btn').onclick = async () => {
        const prompt = [
          'Rewrite my resume for the job description below and return ONLY one valid JSON object (no markdown, no comments) in exactly the schema shown.',
          '',
          'Rules:',
          '- Keep everything truthful: reorder, re-word and emphasise what is relevant; never invent employers, dates, degrees or numbers.',
          '- Aim for ONE page: 3–5 concise bullets per role/project, one line each where possible.',
          '- Put the most relevant skills first. Use keywords from the job description naturally.',
          '- All fields are optional – omit a section by leaving it out. Section order can be set with "order".',
          '- Plain text only (no HTML). Use \u2014 for dashes if needed.',
          '',
          'Schema (field -> meaning):',
          '{',
          '  "name": "FULL NAME",',
          '  "contact": { "location": "", "email": "", "phone": "", "website": "", "websiteUrl": "https://…", "linkedin": "", "linkedinUrl": "https://…", "github": "", "githubUrl": "https://…", "extra": ["any other text"] },',
          '  "headings": { "summary": "PROFESSIONAL SUMMARY", "skills": "CORE SKILLS", "experience": "WORK EXPERIENCE", "projects": "PROJECTS", "education": "EDUCATION", "certifications": "CERTIFICATIONS", "github": "GITHUB PROFILE", "languages": "LANGUAGES" },   // optional renames',
          '  "order": ["summary","skills","experience","projects","education","certifications","github","languages","custom"],   // optional',
          '  "summary": "2–3 sentence summary",',
          '  "skills": [ { "label": "Category", "value": "skill, skill, skill" } ],',
          '  "experience": [ { "role": "", "company": "", "location": "", "dates": "Jan 2024 – Present", "bullets": ["…"] } ],',
          '  "projects": [ { "title": "Name — short description", "link": "display text", "url": "https://…", "tech": "A · B · C", "bullets": ["…"] } ],',
          '  "education": [ { "degree": "", "year": "", "institution": "", "gradeLabel": "cgpa:", "grade": "" } ],',
          '  "certifications": ["…"],',
          '  "github": { "link": "github.com/user", "url": "https://github.com/user", "text": "one sentence" },',
          '  "languages": [ { "name": "English", "level": "Fluent" } ],',
          '  "custom": [ { "heading": "ACHIEVEMENTS", "bullets": ["…"] } ]   // any extra sections (also supports "text": "…" or "rows": [{label,value}])',
          '}',
          '',
          'MY CURRENT RESUME (JSON):',
          input.value,
          '',
          'JOB DESCRIPTION / TARGET ROLE:',
          '<paste here>'
        ].join('\n');
        const ok = await copyText(prompt);
        toast(ok ? 'AI prompt copied — paste it into an AI chat with the job description, then paste the JSON it returns here.' : 'Could not access the clipboard.', ok ? '' : 'error');
      };
      $('reset-btn').onclick = () => {
        closeMenus();
        if (!confirm('Reset the resume to the original content? Your edits will be lost.')) return;
        input.value = DEFAULT_JSON; apply(DEFAULT_JSON);
        try { localStorage.removeItem(STORE_KEY); } catch (_) { }
        toast('Resume reset to the original');
      };
      $('save-btn').onclick = () => {
        closeMenus();
        const blob = new Blob([input.value], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'resume.json';
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast('Saved resume.json');
      };
      $('load-btn').onclick = () => { closeMenus(); $('file-input').click(); };
      function loadFile(f) {
        if (!f) return;
        const r = new FileReader();
        r.onload = () => { input.value = String(r.result); apply(input.value); toast('Loaded ' + f.name); };
        r.readAsText(f);
      }
      $('file-input').onchange = (e) => { loadFile(e.target.files[0]); e.target.value = ''; };
      $('toggle-editor').onclick = () => {
        const ed = $('editor'); const hidden = ed.classList.toggle('hidden');
        $('toggle-editor').querySelector('span').textContent = hidden ? 'Show JSON' : 'Hide JSON'; fit();
      };

      /* ---------------- preview zoom (display only) + page-break guides ---------------- */
      let zoomMode = 'fit', zoomVal = 1;
      function fit() {
        const box = $('preview-fit');
        box.style.zoom = 1;
        const ws = $('workspace'), cs = getComputedStyle(ws);
        const inner = ws.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const ed = $('editor'); const side = ed.classList.contains('hidden') || getComputedStyle(ed).display === 'none' ? 0 : ed.offsetWidth + 20;
        const room = Math.max(280, inner - side);
        const w = resumeEl.offsetWidth;
        const fitScale = Math.min(1, room / w);
        zoomVal = zoomMode === 'fit' ? fitScale : zoomVal;
        box.style.zoom = zoomVal;
        $('zoom-label').textContent = Math.round(zoomVal * 100) + '%';
        drawGuides();
      }
      function drawGuides() {
        const g = $('guides'); g.replaceChildren();
        const contentH = resumeEl.querySelector('.content') ? resumeEl.querySelector('.content').offsetHeight : 0;
        const pageHeight = PAGE_PT();
        const pages = Math.ceil(contentH * 0.75 / pageHeight);
        for (let k = 1; k < pages; k++) {
          const line = el('div', 'guide'); line.style.top = (activePage.marginsPt[0] + k * pageHeight) + 'pt'; add(line, el('span', '', 'Page ' + (k + 1)));
          g.appendChild(line);
        }
      }
      function setZoom(v) { zoomMode = 'manual'; zoomVal = Math.min(1.6, Math.max(0.4, v)); fit(); }
      $('zoom-in').onclick = () => setZoom(zoomVal + 0.1);
      $('zoom-out').onclick = () => setZoom(zoomVal - 0.1);
      $('zoom-fit').onclick = () => { zoomMode = 'fit'; fit(); };
      window.addEventListener('resize', fit);

      /* ---------------- PDF ---------------- */
      // The PDF library (~900 KB) is fetched lazily: during idle time after first paint, or on first click.
      const LIB_URLS = [
        'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js',
        'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'
      ];
      let libPromise = null;
      function loadLib() {
        if (typeof window.html2pdf === 'function') return Promise.resolve(true);
        if (libPromise) return libPromise;
        libPromise = (async () => {
          for (const url of LIB_URLS) {
            const ok = await new Promise(res => {
              const sc = document.createElement('script');
              sc.src = url; sc.async = true; sc.onload = () => res(true); sc.onerror = () => { sc.remove(); res(false); };
              document.head.appendChild(sc);
            });
            if (ok && typeof window.html2pdf === 'function') return true;
          }
          libPromise = null; return false;
        })();
        return libPromise;
      }
      (window.requestIdleCallback || ((f) => setTimeout(f, 2500)))(() => loadLib(), { timeout: 4000 });
      const fileName = () => (str(current && current.name).trim().replace(/[^\w]+/g, '_').replace(/^_|_$/g, '') || 'Resume') + (activeFormatId === 'original' ? '' : '_' + activeFormatId.toUpperCase()) + '_Resume.pdf';

      /* ---------------- Light-theme Print & PDF Export Guarantees ---------------- */
      let printThemeState = null;
      function prepareLightExport() {
        printThemeState = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.colorScheme = 'light';
      }
      function cleanupLightExport() {
        if (printThemeState) {
          document.documentElement.setAttribute('data-theme', printThemeState);
        }
        document.documentElement.style.colorScheme = '';
        printThemeState = null;
      }
      window.addEventListener('beforeprint', prepareLightExport);
      window.addEventListener('afterprint', cleanupLightExport);

      $('print-btn').onclick = () => {
        const old = document.title;
        document.title = fileName().replace(/\.pdf$/, '');
        prepareLightExport();
        setTimeout(() => {
          window.print();
          setTimeout(() => {
            document.title = old;
            cleanupLightExport();
          }, 500);
        }, 50);
      };

      $('download-btn').onclick = async function () {
        const btn = this;
        const lbl = $('download-label'); btn.disabled = true; const label = lbl.textContent; lbl.textContent = 'Generating…';
        if (!(await loadLib())) {                                // CDN blocked / offline → fall back to print dialog
          btn.disabled = false; lbl.textContent = label;
          toast('PDF library could not be loaded (offline?). Opening the print dialog — choose “Save as PDF”.', 'error');
          return $('print-btn').click();
        }
        prepareLightExport();
        const stage = $('export-stage'); stage.replaceChildren();
        const clone = resumeEl.cloneNode(true); clone.removeAttribute('id'); clone.classList.add('export');
        clone.style.width = (activePage.widthPt - activePage.marginsPt[1] - activePage.marginsPt[3]) + 'pt';
        clone.style.minHeight = '0';
        stage.appendChild(clone);
        try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (_) { }
        try {
          await window.html2pdf().set({
            margin: activePage.marginsPt,
            filename: fileName(),
            image: { type: 'png' },
            html2canvas: { scale: 2.5, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
            jsPDF: { unit: 'pt', format: activePage.size.toLowerCase(), orientation: 'portrait', compress: true },
            pagebreak: { mode: ['css'], avoid: ['li', '.r-proj-title', '.r-tech', '.r-h', '.r-edu-top', '.r-edu-sub', '.r-skill'] }
          }).from(clone).save();
        } catch (err) {
          toast('PDF generation failed: ' + err.message, 'error');
        } finally {
          cleanupLightExport();
          stage.replaceChildren(); btn.disabled = false; lbl.textContent = label; toast('PDF downloaded');
        }
      };

      /* ---------------- UI behaviours ---------------- */
      function closeMenus() { document.querySelectorAll('details.menu[open]').forEach(d => d.removeAttribute('open')); }
      document.addEventListener('click', (e) => { if (!e.target.closest('details.menu')) closeMenus(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });
      document.querySelectorAll('details.menu').forEach(d => d.addEventListener('toggle', () => { if (d.open) document.querySelectorAll('details.menu[open]').forEach(o => o !== d && o.removeAttribute('open')); }));

      // theme: auto → light → dark
      const THEME_KEY = 'resume-theme';
      function setTheme(t) {
        if (t) document.documentElement.setAttribute('data-theme', t);
        $('theme-icon').setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
        try { localStorage.setItem(THEME_KEY, t); } catch (_) { }
      }
      (function () {
        let t = null; try { t = localStorage.getItem(THEME_KEY); } catch (_) { }
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        setTheme(t);
      })();
      $('theme-btn').onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

      // mobile tabs
      function setView(v) {
        $('workspace').dataset.view = v;
        $('tab-edit').setAttribute('aria-selected', v === 'edit'); $('tab-preview').setAttribute('aria-selected', v === 'preview');
        fit();
      }
      $('tab-edit').onclick = () => setView('edit'); $('tab-preview').onclick = () => setView('preview');

      // editor: Tab key indents, click error to jump, drag & drop a .json file
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); const s0 = input.selectionStart, e0 = input.selectionEnd;
          input.setRangeText('  ', s0, e0, 'end'); input.dispatchEvent(new Event('input'));
        }
      });
      statusEl.addEventListener('click', () => {
        if (errPos == null) return;
        input.focus(); input.setSelectionRange(errPos, Math.min(errPos + 1, input.value.length));
        const lineNo = input.value.slice(0, errPos).split('\n').length; input.scrollTop = Math.max(0, (lineNo - 4) * 20);
      });
      const editorEl = $('editor'); let dragDepth = 0;
      document.addEventListener('dragenter', (e) => {
        if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
          e.preventDefault(); dragDepth++; editorEl.classList.add('dragging');
        }
      });
      document.addEventListener('dragover', (e) => {
        if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); }
      });
      document.addEventListener('dragleave', (e) => {
        dragDepth--;
        if (dragDepth <= 0) { dragDepth = 0; editorEl.classList.remove('dragging'); }
      });
      document.addEventListener('drop', (e) => {
        dragDepth = 0; editorEl.classList.remove('dragging');
        if (!e.dataTransfer || !e.dataTransfer.files.length) return;
        e.preventDefault(); loadFile(e.dataTransfer.files[0]);
      });

      // add-section templates
      const TEMPLATES = {
        experience: { role: 'Job Title', company: 'Company', location: 'City', dates: 'Jan 2024 – Present', bullets: ['Achievement or responsibility with a measurable result.'] },
        projects: { title: 'Project Name — short description', link: '', url: '', tech: 'Tool A · Tool B', bullets: ['What you built and the outcome.'] },
        education: { degree: 'Degree', year: '2026', institution: 'Institution, City', gradeLabel: 'cgpa:', grade: '' },
        certifications: 'Certification name',
        languages: { name: 'English', level: 'Fluent' },
        github: { link: 'github.com/username', url: 'https://github.com/username', text: 'One sentence about your profile.' },
        custom: { heading: 'ACHIEVEMENTS', bullets: ['Achievement one.'] }
      };
      document.querySelectorAll('[data-add]').forEach(btn => btn.addEventListener('click', () => {
        closeMenus();
        let d; try { d = JSON.parse(input.value); } catch (e) { return toast('Fix the JSON error first, then add a section.', 'error'); }
        if (!isObj(d)) return toast('Top level must be a JSON object.', 'error');
        const k = btn.dataset.add, tpl = JSON.parse(JSON.stringify(TEMPLATES[k]));
        if (k === 'github') { if (d.github) return toast('GitHub section already exists.'); d.github = tpl; }
        else { if (!Array.isArray(d[k])) d[k] = []; d[k].push(tpl); }
        input.value = JSON.stringify(d, null, 2); apply(input.value);
        const idx = input.value.lastIndexOf(k === 'custom' ? '"heading"' : '"' + k + '"');
        if (idx >= 0) { input.focus(); input.setSelectionRange(idx, idx); input.scrollTop = Math.max(0, (input.value.slice(0, idx).split('\n').length - 3) * 20); }
        toast('Added “' + k + '” — edit the placeholder text.');
      }));

      // shortcuts
      document.addEventListener('keydown', (e) => {
        if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
        const k = e.key.toLowerCase();
        if (k === 's') { e.preventDefault(); $('download-btn').click(); }
        else if (k === 'p') { e.preventDefault(); $('print-btn').click(); }
      });

      /* ---------------- init ---------------- */
      // Restore the format independently from the resume JSON.
      let savedFormat = 'original';
      try { savedFormat = localStorage.getItem(FORMAT_STORE_KEY) || 'original'; } catch (_) { }
      setActiveFormat(savedFormat, { persist: false, rerender: false });

      // Auto-detect when default-data in HTML file is updated on disk:
      const dataSignature = 'sig_' + DEFAULT_JSON.length + '_' + (DEFAULT_JSON.slice(0, 30) + DEFAULT_JSON.slice(-30)).replace(/\s+/g, '');
      const lastSignature = localStorage.getItem('resume-default-sig');
      let initial = DEFAULT_JSON;
      if (lastSignature !== dataSignature) {
        try { localStorage.removeItem(STORE_KEY); } catch (_) { }
        try { localStorage.setItem('resume-default-sig', dataSignature); } catch (_) { }
        initial = DEFAULT_JSON;
      } else {
        try { const saved = localStorage.getItem(STORE_KEY); if (saved) { JSON.parse(saved); initial = saved; } } catch (_) { }
      }
      input.value = initial;
      if (!apply(initial, { save: false })) { input.value = DEFAULT_JSON; apply(DEFAULT_JSON, { save: false }); }
      updateCounter();
      if (window.innerWidth <= 960) setView('preview');
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      fit();
    })();
  </script>
</body>

</html>
